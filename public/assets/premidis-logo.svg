<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <!-- Cyan to Blue Gradient (Left Loop 'P') -->
    <linearGradient id="premCyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <!-- Magenta to Purple Gradient (Right Loop 'D') -->
    <linearGradient id="premPurpleMagenta" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B0764" />
      <stop offset="50%" stop-color="#6B21A8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="premGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08" />
    </filter>
  </defs>
  <!-- Outer subtle oval ring -->
  <ellipse cx="200" cy="115" rx="145" ry="92" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2.5" />
  <!-- Interlocking Rings / Ribbon loops -->
  <g filter="url(#premGlow)">
    <!-- Right Purple Loop ('d') - Background part -->
    <path
      d="M 235 55 C 275 60 295 85 295 115 C 295 145 265 170 225 170 C 185 170 170 142 175 115 C 180 88 205 60 255 45 C 265 42 278 40 285 58 C 290 70 282 82 270 85 C 240 92 225 105 225 120 C 225 135 240 145 258 145 C 278 145 272 120 262 105 C 255 95 242 85 235 55 Z"
      fill="none"
    />
    <!-- Ribbon Left Loop (Cyan-Blue) -->
    <path
      d="M 175 48 C 120 52 95 82 95 115 C 95 150 125 172 165 172 C 205 172 220 142 216 115 C 212 88 190 62 145 52 C 125 47 115 62 122 75 C 128 85 142 88 158 92 C 182 98 192 110 190 124 C 188 140 170 150 152 150 C 130 150 118 135 118 115 C 118 92 135 72 175 68 Z"
      fill="url(#premCyanBlue)"
    />
    <!-- Ribbon Right Loop (Purple-Magenta) Interlocking -->
    <path
      d="M 225 172 C 275 172 305 145 305 115 C 305 78 272 52 230 52 C 190 52 178 85 182 115 C 185 138 205 160 245 168 C 265 172 276 158 270 145 C 264 135 250 132 235 128 C 212 122 204 110 205 96 C 206 82 222 72 242 72 C 265 72 280 88 280 115 C 280 136 260 152 225 152 Z"
      fill="url(#premPurpleMagenta)"
    />
    <!-- Top-Right Upward ribbon flourish for right loop -->
    <path
      d="M 245 68 C 260 48 280 38 296 46 C 310 54 308 72 292 84 C 278 95 264 88 252 74 Z"
      fill="url(#premPurpleMagenta)"
    />
    <!-- Top-Left Inward loop connection -->
    <path
      d="M 152 68 C 138 82 132 100 132 116 C 132 138 146 148 162 148 C 178 148 188 136 190 120 C 192 102 180 86 160 76 Z"
      fill="none"
    />
  </g>
  <!-- Typography: PREMIDIS -->
  <text
    x="200"
    y="245"
    text-anchor="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="44"
    font-weight="900"
    fill="#211A5C"
    letter-spacing="5"
  >PREMIDIS</text>
  <!-- Typography: S.A.R.L -->
  <text
    x="200"
    y="292"
    text-anchor="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="34"
    font-weight="900"
    fill="#211A5C"
    letter-spacing="14"
  >S.A.R.L</text>
</svg>
