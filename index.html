<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ERP Distribution</title>
    <meta name="description" content="Plateforme de gestion intégrée (CRM, Ventes, Caisse, Stock, Crédits, Comptabilité)" />
    <meta property="og:title" content="ERP Distribution" />
    <meta property="og:description" content="Plateforme de gestion intégrée (CRM, Ventes, Caisse, Stock, Crédits, Comptabilité)" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Thème enregistré appliqué avant le chargement de l'application (évite le flash du mauvais thème)
      (function () {
        try {
          var p = localStorage.getItem("premidis_theme") || "light";
          var dark = p === "dark" || (p === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
